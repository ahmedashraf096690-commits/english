name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js gx.js www/
          cp apk/capacitor.config.json capacitor.config.json
      - name: Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor-community/text-to-speech@5.1.0
          npx cap add android
          npx cap sync android
      - name: Customize
        run: python3 apk/prepare.py
      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > release.jks
      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk english.apk
          gh release create "v${{ github.run_number }}" english.apk --title "English app v${{ github.run_number }}" --notes "APK for Android" --latest
