function startUnit(u){const l=[];for(let i=UNITS[u][0];i<=UNITS[u][1];i++)l.push(...items(i));T={name:`اختبار الوحدة ${u+1}`,qs:mkTest(l,15,false),i:0,ok:0,pass:75,after:p=>{S.unit[u]=Math.max(S.unit[u]||0,p)},back:u==4?"call":"course"};render()}
// ---- call-center tab ----
function call(){let h=`<div class="hero"><div><b style="font-size:19px">🎧 إنجليزي الكول سنتر</b><div>جمل ومكالمات حقيقية، من أول يوم</div></div></div>`;
for(let i=CORE_N;i<LESSONS.length;i++)h+=lessonRow(i);
h+=`<h2>تدريبات</h2><div class="card"><b>⌨️ تدريب الكتابة السريعة</b><div class="ar">الشركات بتطلب غالبا سرعة كتابة حوالي ٣٥ كلمة في الدقيقة (رقم تقريبي من مصادر خارجية). اكتب جمل المكالمات بسرعة ودقة.</div><button class="b w" onclick="startTyping()">ابدأ الكتابة</button>${S.type.best?`<div class="ph">أفضل سرعة: ${S.type.best} كلمة/دقيقة</div>`:''}</div>
<div class="card"><b>🎙️ تمثيل مكالمة (Role-play)</b><div class="ar">افتح أي درس كول سنتر ثم تبويب «حوار»: اخفِ كلام الموظف وقله بصوتك قبل ما تسمعه.</div></div>
<div class="note">الأرقام والتفاصيل عن مراحل التوظيف في مصر (اختبار صوتي، مقابلة، اختبار لغة، كتابة) من مصادر خارجية غير رسمية، فاعتبرها إرشاد عام.</div>`;
$("#app").innerHTML=h}
// ---- typing drill ----
function startTyping(){const pool=LESSONS.slice(CORE_N).flatMap(l=>l.s.map(x=>x[0]));view={typing:1,txt:shuf(pool).slice(0,3).join(" "),t0:0,done:0};render()}
function typingV(){const v=view;$("#app").innerHTML=`<div class="row"><b>⌨️ كتابة سريعة</b><button class="b s" onclick="view=null;render()">رجوع</button></div><div class="card"><div class="en" style="font-size:19px;font-weight:600" id="tg"></div></div><textarea id="ti" dir="ltr" rows="4" style="width:100%;font-size:18px;border-radius:12px;padding:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ابدأ الكتابة هنا..."></textarea><div id="tr"></div>`;
$("#ti").oninput=function(){if(!v.t0)v.t0=Date.now();const t=this.value,g=v.txt;let ok=0;for(let i=0;i<t.length;i++)if(t[i]===g[i])ok++;
$("#tg").innerHTML=[...g].map((c,i)=>i<t.length?`<span style="color:${t[i]===c?'var(--ok)':'var(--bad)'}">${c}</span>`:c).join("");
if(t.length>=g.length){const m=(Date.now()-v.t0)/60000,w=Math.round(g.split(" ").length/m),acc=Math.round(ok/g.length*100);S.xp+=10;if(w>(S.type.best||0)&&acc>=90)S.type.best=w;S.days[today()]=(S.days[today()]||0)+1;save();this.disabled=true;
$("#tr").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:40px">⌨️</div><b>${w} كلمة/دقيقة · دقة ${acc}%</b><div class="ph">الدقة أهم من السرعة: ابدأ بدقة ٩٥%+ وبعدين زود السرعة.</div></div><button class="b w" onclick="startTyping()">جملة جديدة</button>`}};$("#tg").textContent=v.txt;$("#ti").focus()}
// ---- lesson (dynamic steps, dialogue) ----
function lessonV(){const i=view.lesson,L=LESSONS[i];const st=[];if(L.L)st.push(["حروف",0]);st.push(["كلمات",1],["جمل",2]);if(L.d)st.push(["حوار",4]);st.push(["قاعدة",3]);
if(view.step==null||!st.some(x=>x[1]==view.step))view.step=st[0][1];let b="";
const tabs=`<div class="row" style="margin:6px 0">${st.map(s=>`<button class="b ${s[1]==view.step?'':'s'}" style="flex:1;margin:0 2px;padding:8px 2px;font-size:14px" onclick="view.step=${s[1]};render()">${s[0]}</button>`).join("")}</div>`;
const btn=t=>`<button class="b s" onclick="say('${esc(t)}')">🔊</button><button class="b s" onclick="say('${esc(t)}','en-US',.5)">🐢</button>`;
if(view.step==0){b=`<div class="note">حروف وأصوات الدرس. اسمع كل مثال وكرره بصوت عالي.</div>`+L.L.map(l=>`<div class="card"><div class="row"><div class="big">${l[0]}</div><div style="flex:1"><div class="ar"><b>${l[1]}</b></div><div class="ph">${l[2]}</div><div class="en" style="font-size:20px">${l[5]} ${l[3]} <span class="ph" style="font-size:14px">(${l[4]})</span></div></div></div><button class="b s" onclick="say('${l[3]}')">🔊 ${l[3]}</button><button class="b s" onclick="say('${l[3]}','en-US',.5)">🐢</button>${l[6]?`<button class="b s" onclick="mouthOpen('${l[6]}')">👄 شوف وضع الفم</button>`:''}</div>`).join("")}
else if(view.step==1)b=L.w.map(w=>`<div class="card"><div class="row"><div><div class="en">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div></div><div>${btn(w[0])}</div></div></div>`).join("");
else if(view.step==2)b=L.s.map(w=>`<div class="card"><div class="en" style="font-size:20px">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div>${btn(w[0])}<button class="b s" onclick="shadow('${esc(w[0])}')">🎙️ سجّل صوتك</button><div id="sh"></div></div>`).join("");
else if(view.step==4){const hide=view.hide;b=`<div class="note">اضغط «اخفِ كلام الموظف»، قل جملة الموظف بصوتك، وبعدين اسمعها وقارن. A = الموظف (إنت)، C = العميل.</div><button class="b s w" onclick="view.hide=!view.hide;render()">${hide?'أظهر كلام الموظف':'اخفِ كلام الموظف'}</button>`+L.d.map(x=>`<div class="card" style="${x[0]=='A'?'border-right:5px solid var(--pri)':''}"><b>${x[0]=='A'?'🧑‍💼 الموظف':'🙋 العميل'}</b>${x[0]=='A'&&hide?'<div class="ph">النص مخفي... قلها بصوتك</div>':`<div class="en" style="font-size:18px">${x[1]}</div><div class="ar">${x[2]}</div>`}${btn(x[1])}</div>`).join("")}
else b=`<div class="card"><b>📘 شرح القاعدة</b><div class="ar" style="margin:8px 0">${L.n}</div><button class="b s" onclick="sayAr('${esc(L.n)}')">🔊 اسمع الشرح بالعربي</button><div class="ph">الصوت العربي بيعتمد على الأصوات المنزّلة في تليفونك.</div></div>`;
$("#app").innerHTML=`<div class="row"><b>${isCC(i)?'🎧 كول سنتر':'الدرس '+(i+1)}: ${L.e} ${L.t}</b><button class="b s" onclick="view=null;render()">رجوع</button></div>${tabs}${b}<button class="b w" onclick="startLesson(${i})">✍️ ابدأ اختبار الدرس</button>`;scrollTo(0,0)}
function startLesson(i){T={name:`اختبار: ${LESSONS[i].t}`,qs:mkTest(items(i),8,true),i:0,ok:0,pass:70,after:p=>{S.done[i]=Math.max(S.done[i]||0,p);if(p>=70)S.xp+=20},back:"lesson",les:i};render()}
// ---- shadowing recorder (no scoring: play model then your own voice) ----
let rec=null;
async function shadow(t){const el=document.getElementById("sh");
if(rec&&rec.state==="recording"){rec.stop();return}
try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());const u=URL.createObjectURL(new Blob(ch,{type:rec.mimeType}));if(el)el.innerHTML=`<div class="ph">سمّع الاتنين وقارن بنفسك:</div><button class="b s" onclick="say('${esc(t)}')">🔊 النموذج</button><audio controls src="${u}" style="width:100%"></audio>`};
rec.start();if(el)el.innerHTML=`<button class="b" style="background:#c0392b" onclick="rec.stop()">⏹️ إيقاف التسجيل</button> <span class="ph">بيسجل... قل الجملة</span>`;say(t)}catch(e){alert("محتاج تسمح بالميكروفون")}}
// ---- review (SM-2) ----
function startReview(){let l=dueItems().slice(0,10);if(l.length<5){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).map(Number);l=l.concat(shuf(d.flatMap(items)).slice(0,10-l.length))}
if(!l.length)return;T={name:"مراجعة ذكية",qs:mkTest(l,10,false),i:0,ok:0,pass:70,after:p=>{S.revs++;S.rv=today();S.xp+=10},back:"review"};tab="review";render()}
function review(){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).length,due=dueItems().length;const wr=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,8);
$("#app").innerHTML=`<div class="card"><b>🔁 مراجعة ذكية (تكرار متباعد)</b><div class="ar">الكلمة اللي تجاوبها صح بترجع بعد ١ ثم ٣ أيام ثم أكتر. اللي بتغلط فيها بترجع بسرعة. ده أسرع طريق للحفظ طويل المدى.</div>${d?`<div class="tag">مستحق دلوقتي: ${due}</div><button class="b w" onclick="startReview()">ابدأ المراجعة</button>`:'<div class="note">خلص درس واحد على الأقل الأول.</div>'}</div>
${wr.length?`<h2>كلمات محتاجة تركيز</h2><div class="card">${wr.map(w=>`<div class="item row"><span class="en" style="font-size:18px">${w[0]}</span><span class="tag">غلطات: ${w[1]}</span></div>`).join("")}</div>`:''}`}
function pick(k){const q=T.qs[T.i];q.d=k;const ok=q.opts[k]===q.ans;if(ok){T.ok++;S.xp+=2}else if(q.it){S.wrong[q.it.en]=(S.wrong[q.it.en]||0)+1}if(q.it&&q.type!="let")srUpdate(q.it.en,ok);save();render()}
// ---- placement ----
function startPlacement(){const l=[0,4,8,12,16,20,24,28].flatMap(i=>items(i).filter(x=>x.k=="w").slice(0,2)).concat([2,6,10,14].map(i=>items(i)[7]));T={name:"تحديد المستوى",qs:mkTest(l,12,false),i:0,ok:0,pass:0,after:p=>{const s=Math.round(p*12/100);const st=s>=11?15:s>=8?8:s>=5?4:0;S.pl=st;if(st){S.plmsg=st}},back:"home",place:1};render()}
// ---- test result (adds placement + XP) ----
function testV(){const q=T.qs[T.i];if(!q){const p=Math.round(T.ok/T.qs.length*100),pass=p>=T.pass;T.after(p);S.days[today()]=(S.days[today()]||0)+1;save();
if(T.place){const st=S.pl;$("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🎯</div><b>نتيجتك: ${p}%</b><div class="ar">${st?`ننصحك تبدأ من الدرس ${st+1}. الدروس قبله ممكن ترجعلها وقت ما تحب.`:'ابدأ من الدرس ١ علشان تبني الأساس صح.'}</div></div>${st?`<button class="b w" onclick="for(let i=0;i<${st};i++)if(!(S.done[i]>=70))S.done[i]=71;save();T=null;go('home')">تمام، ابدأ من الدرس ${st+1} (يتم احتساب الدروس السابقة)</button>`:''}<button class="b s w" onclick="T=null;go('home')">ابدأ من الأول</button>`;return}
$("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">${pass?'🎉':'💪'}</div><b>${T.name}: ${p}%</b><div class="ar">${pass?'نجحت! ✅':`محتاج ${T.pass}% عشان تعدي. راجع وحاول تاني.`}</div></div><button class="b w" onclick="${T.back=='lesson'?`T=null;view={lesson:${T.les}};render()`:`go('${T.back}')`}">${T.back=='lesson'?'رجوع للدرس':'تمام'}</button>${pass&&T.back=='lesson'?`<button class="b s w" onclick="go('home')">الرئيسية</button>`:''}`;return}
$("#app").innerHTML=`<div class="ph">${T.name} · ${T.i+1}/${T.qs.length}</div><div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div><div class="card"><div class="ar">${q.ask}</div><div class="${q.en?'en':'ar'}" style="margin:8px 0;${q.en?'':'font-size:24px'}">${q.p}</div>${q.say?`<button class="b s" onclick="say('${esc(q.say)}')">🔊</button>`:''}</div>${q.opts.map((o,k)=>`<button class="opt ${q.lopt||q.type=='let'?'l':''} ${q.d!=null?(o===q.ans?'ok':q.d===k?'no':''):''}" ${q.d!=null?'disabled':''} onclick="pick(${k})">${o}</button>`).join("")}${q.d!=null?`<button class="b w" onclick="T.i++;render()">التالي</button>`:''}`;
if(q.auto&&!q.played){q.played=1;setTimeout(()=>say(q.say),300)}}
// ---- pronunciation tab: mouths + minimal pairs ----
const PAIRS=[["ship","sheep"],["bit","beat"],["pen","ben"],["pan","ban"],["very","berry"],["fine","vine"],["light","right"],["think","sink"],["full","fool"],["cat","cut"]];
function mouth(){$("#app").innerHTML=`<div class="note">رسومات توضح وضع اللسان والشفايف. الدايرة الحمرا مكان الحركة. اسمع المثال بعد ما تشوف الرسمة.</div><div class="card"><b>👂 أزواج صوتية (Minimal pairs)</b><div class="ph">كلمات صوتها قريب. افرق بينهم بالسمع والنطق.</div>${PAIRS.map(p=>`<div class="item row"><span class="en" style="font-size:18px">${p[0]} / ${p[1]}</span><span><button class="b s" onclick="say('${p[0]}','en-US',.7)">🔊 ${p[0]}</button><button class="b s" onclick="say('${p[1]}','en-US',.7)">🔊 ${p[1]}</button></span></div>`).join("")}</div>`+MORD.map(k=>mouthCard(k)).join("")}
// ---- settings ----
function me(){const installed=matchMedia("(display-mode: standalone)").matches;const perm=window.Notification?Notification.permission:"غير مدعوم";const dc=Object.keys(S.done).filter(k=>S.done[k]>=70).length;
$("#app").innerHTML=`<div class="card"><b>🎨 المظهر</b><div class="row" style="margin-top:6px"><button class="b ${S.theme=='light'?'':'s'}" style="flex:1" onclick="S.theme='light';save();render()">☀️ فاتح</button><button class="b ${S.theme=='soft'?'':'s'}" style="flex:1" onclick="S.theme='soft';save();render()">🌙 داكن هادي</button></div></div>
<div class="card"><b>🔔 تذكير يومي</b><div class="ar">وقت التذكير: <input type="time" value="${S.rem.time}" onchange="S.rem.time=this.value;save();pushCfg()"></div>
<button class="b w" onclick="setRem(${!S.rem.on})">${S.rem.on?'إيقاف التذكير':'تشغيل التذكير'}</button><button class="b s w" onclick="notify('تجربة: '+taskText())">جرب إشعار الآن</button>
<div class="note">حالة الإذن: ${perm}. ${installed?'التطبيق مثبت ✅':'التطبيق غير مثبت: التذكير بيشتغل بس وهو مفتوح.'} لو الأندرويد وقف التطبيق في الخلفية ممكن التذكير يتأخر، شغّل "بدون قيود للبطارية" للتطبيق.</div></div>
<div class="card"><b>🧾 إحصائيات</b><div class="ar">XP: ${S.xp} · المستوى ${lvl()}<br>دروس مكتملة: ${dc} / ${LESSONS.length}<br>أيام تدريب: ${Object.keys(S.days).length}<br>مرات المراجعة: ${S.revs}<br>كلمات في المراجعة الذكية: ${Object.keys(S.sr).length}</div></div>
<div class="card"><button class="b r w" style="background:#c0392b" onclick="if(confirm('مسح كل التقدم؟')){localStorage.removeItem('eng2');location.reload()}">مسح التقدم</button></div>`}
render();
</script></body></html>
