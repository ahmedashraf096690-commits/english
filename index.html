"إبداء الرأي والموافقة|🗣️|In my opinion / I think / I believe. للموافقة I agree / exactly. للاختلاف بأدب: I see your point, but... I'm not sure about that.|in my opinion=إن ماي أوبينيون=في رأيي;I agree=آي أجري=أنا موافق;I disagree=آي ديساجري=أنا مش موافق;I see your point=آي سي يور بوينت=فاهم وجهة نظرك;however=هاوفر=ومع ذلك;on the other hand=أون ذي أذر هاند=من ناحية تانية;exactly=إجزاكتلي=بالظبط;not sure=نوت شور=مش متأكد|In my opinion, this plan is better.=إن ماي أوبينيون ذيس بلان إز بيتر=في رأيي الخطة دي أحسن.;I see your point, but I disagree.=آي سي يور بوينت بات آي ديساجري=فاهم وجهة نظرك بس مش موافق.;I am not sure about that.=آي آم نوت شور أباوت ذات=مش متأكد من ده.;What do you think?=وات دو يو ثينك=رأيك إيه؟|A:I think we should start tomorrow.=أعتقد نبدأ بكرة.;B:I agree, that is a good idea.=موافق، فكرة حلوة.",
"أفعال مركبة 1 (phrasal verbs)|🧲|الفعل + حرف بيتغير المعنى: look up = يدور على، turn on = يشغل، give up = يستسلم. بعضها بيتفصل: turn it on.|look up=لوك آب=يدور على;turn on=ترن أون=يشغل;turn off=ترن أوف=يقفل;give up=جيف آب=يستسلم;find out=فايند أوت=يكتشف;pick up=بيك آب=يلتقط / يرد;put on=بوت أون=يلبس;take off=تيك أوف=يقلع / يخلع|Please turn off your phone.=بليز ترن أوف يور فون=من فضلك اقفل تليفونك.;Don't give up, keep trying.=دونت جيف آب كيب ترايينج=ما تستسلمش، كمل.;I will find out the answer.=آي ويل فايند أوت ذي آنسر=هعرف الإجابة.;Can you pick up the phone?=كان يو بيك آب ذا فون=ممكن ترد على التليفون؟|A:The line is dead.=الخط واقع.;B:Let me look it up.=خليني أدور على السبب.",
"أفعال مركبة 2|🧲|set up = يجهّز، sign up = يسجل، call back = يرد على المكالمة، carry on = يكمل، fill in = يملا (استمارة)، run out of = يخلص من.|set up=سيت آب=يجهّز;sign up=ساين آب=يسجل;call back=كول باك=يرد الاتصال;carry on=كاري أون=يكمل;fill in=فيل إن=يملا;run out of=ران أوت أوف=يخلص من;look after=لوك آفتر=يهتم بـ;get along=جت ألونج=يتفاهم مع|I will call you back in ten minutes.=آي ويل كول يو باك إن تن مينتس=هرد عليك بعد عشر دقايق.;Please fill in this form.=بليز فيل إن ذيس فورم=املا الاستمارة دي من فضلك.;We ran out of time.=وي ران أوت أوف تايم=الوقت خلص علينا.;I get along well with my team.=آي جت ألونج ويل ويذ ماي تيم=متفاهم كويس مع فريقي.|A:Can you set up my account?=ممكن تجهز حسابي؟;B:Sure, please fill in your details.=طبعا، املا بياناتك.",
"الشغل والمقابلة|🤝|Tell me about yourself. بنجاوب: خبرة، مهارات، هدف. I am good at... I am responsible for... I'm looking for an opportunity to...|interview=إنترفيو=مقابلة;skills=سكيلز=مهارات;strengths=ستريـنجثس=نقاط قوة;weakness=ويكنس=نقطة ضعف;team player=تيم بلاير=يشتغل بروح الفريق;apply=أبلاي=يقدم;resume=ريزومي=سيرة ذاتية;hired=هايرد=اتوظف|Tell me about yourself.=تيل مي أباوت يورسيلف=احكيلي عن نفسك.;I am good at solving problems.=آي آم جود آت سولفينج برابلمز=كويس في حل المشاكل.;I am looking for an opportunity to grow.=آي آم لوكينج فور أن أوبورتيونيتي تو جرو=بدور على فرصة أنمو فيها.;Why should we hire you?=واي شد وي هاير يو=ليه نوظفك؟|A:What are your strengths?=إيه نقاط قوتك؟;B:I am patient and I communicate clearly.=صبور وبتواصل بوضوح.",

"التكنولوجيا|💻|software, app, update, device. لو في مشكلة: It keeps crashing = بيقفل لوحده. It won't turn on = مش بيشتغل.|software=سوفتوير=برنامج;application=أبليكيشن=تطبيق;device=ديفايس=جهاز;crash=كراش=يقفل فجأة;storage=ستوريج=مساحة التخزين;network=نتورك=شبكة;secure=سيكيور=آمن;feature=فيتشر=ميزة|The app keeps crashing.=ذي آب كيبس كراشينج=التطبيق بيقفل كل شوية.;My storage is full.=ماي ستوريج إز فول=المساحة مليانة.;It is a very useful feature.=إت إز إيه فيري يوزفل فيتشر=ميزة مفيدة جدا.;Please update the software.=بليز أبديت ذا سوفتوير=حدّث البرنامج من فضلك.|A:My phone won't turn on.=تليفوني مش بيشتغل.;B:Try charging it for ten minutes.=جرب تشحنه عشر دقايق.",
"الصحة ونمط الحياة|🥗|healthy / unhealthy، how often، exercise. You should / shouldn't للنصيحة. I try to... بحاول أـ.|healthy=هيلثي=صحي;exercise=إكسرسايز=تمرين;diet=دايت=نظام غذائي;sleep=سليب=نوم;stress=ستريس=توتر;habit=هابت=عادة;energy=إنرجي=طاقة;recover=ريكفر=يتعافى|You should sleep at least seven hours.=يو شد سليب آت ليست سيفن آورز=المفروض تنام سبع ساعات على الأقل.;I try to exercise three times a week.=آي ترآي تو إكسرسايز ثري تايمز إيه ويك=بحاول أتمرن تلات مرات في الأسبوع.;Too much stress is bad for you.=تو ماتش ستريس إز باد فور يو=التوتر الزايد وحش ليك.;He has a healthy diet.=هي هاز إيه هيلثي دايت=نظامه الغذائي صحي.|A:How do you relax after work?=بتريّح نفسك إزاي بعد الشغل؟;B:I go for a walk.=بمشي شوية.",
"الأخبار والبيئة|🌍|الأخبار بالماضي والمبني للمجهول: A new law was announced. environment, pollution, climate.|news=نيوز=أخبار;environment=إنفايرونمنت=بيئة;pollution=بولوشن=تلوث;climate=كلايمت=مناخ;government=جافرنمنت=حكومة;population=بوبيوليشن=عدد السكان;recycle=ريسايكل=يعيد التدوير;protect=بروتكت=يحمي|Pollution is a big problem in many cities.=بولوشن إز إيه بيج برابلم إن ميني سيتيز=التلوث مشكلة كبيرة في مدن كتير.;We should recycle more.=وي شد ريسايكل مور=المفروض نعيد تدوير أكتر.;The government announced a new plan.=ذا جافرنمنت أناونسد إيه نيو بلان=الحكومة أعلنت خطة جديدة.;Did you read the news today?=ديد يو ريد ذا نيوز تودي=قريت الأخبار النهارده؟|A:What do you think about climate change?=رأيك إيه في تغير المناخ؟;B:It is a serious problem.=مشكلة خطيرة.",

"النصيحة والاقتراحات|💡|You should... / Why don't you...? / How about...? / I suggest + ing. للنصيحة بدون ضغط.|suggest=ساجست=يقترح;recommend=ريكومند=ينصح;advice=أدفايس=نصيحة;try=ترآي=يجرب;why don't you=واي دونت يو=ليه ما...;it would be better=إت وود بي بيتر=الأحسن;you'd better=يود بيتر=الأفضل إنك;worth=ورث=يستحق|Why don't you talk to your manager?=واي دونت يو توك تو يور مانجر=ليه ما تكلمش مديرك؟;I recommend trying the new app.=آي ريكومند ترآينج ذا نيو آب=أنصح تجرب التطبيق الجديد.;You'd better leave now.=يود بيتر ليف ناو=الأفضل تمشي دلوقتي.;It is worth the money.=إت إز ورث ذا ماني=يستحق الفلوس.|A:I can't understand English movies.=مش بفهم الأفلام الإنجليزي.;B:I suggest watching with subtitles first.=أقترح تتفرج بترجمة الأول."],

"التعامل مع الشكاوى (Complaint handling)|🛡️|خطوات: اسمع، تعاطف، اعتذر، حل، تأكد. Thank you for bringing this to our attention. I take full responsibility for fixing it.|bringing to attention=برينجينج تو أتنشن=لفت انتباهنا;take responsibility=تيك ريسبونسبيليتي=يتحمل المسؤولية;resolve=ريزولف=يحل;compensation=كومبنسيشن=تعويض;apology=أبولوجي=اعتذار;escalate=إسكاليت=يصعّد;policy=بوليسي=سياسة;satisfaction=ساتيسفاكشن=رضا|Thank you for bringing this to our attention.=ثانك يو فور برينجينج ذيس تو آور أتنشن=شكرا إنك لفت انتباهنا لده.;I take full responsibility for fixing this.=آي تيك فول ريسبونسبيليتي فور فيكسينج ذيس=أتحمل مسؤولية إصلاح ده بالكامل.;I sincerely apologize for the delay.=آي سينسيرلي أبولوجايز فور ذا ديلاي=أعتذر بصدق عن التأخير.;Let me offer you a solution.=ليت مي أوفر يو إيه سولوشن=خليني أعرض عليك حل.|A:I have been waiting two weeks for my order!=بقالي أسبوعين مستني طلبي!;B:I sincerely apologize. Let me check the status right now.=أعتذر بصدق. خليني أشوف حالته دلوقتي.;A:What is going to happen now?=وإيه اللي هيحصل دلوقتي؟;B:I will send it by express shipping at no extra cost.=هبعته شحن سريع من غير تكلفة زيادة.",
"إلغاء الاشتراك والاحتفاظ بالعميل|🔁|اسأل عن السبب قبل الإلغاء: May I ask why you are leaving? اعرض حل أو عرض. لو أصر، احترم قراره.|cancel=كانسل=يلغي;subscription=سابسكريبشن=اشتراك;retain=ريتين=يحتفظ بـ;offer=أوفر=عرض;discount=ديسكاونت=خصم;reason=ريزن=سبب;switch=سويتش=ينتقل;decision=ديسيجن=قرار|May I ask why you want to cancel?=ماي آي آسك واي يو وانت تو كانسل=ممكن أعرف ليه عايز تلغي؟;I can offer you a thirty percent discount.=آي كان أوفر يو إيه ثيرتي بيرسنت ديسكاونت=أقدر أعرض عليك خصم ٣٠٪.;I respect your decision.=آي ريسبكت يور ديسيجن=بحترم قرارك.;Your subscription will end on Friday.=يور سابسكريبشن ويل إند أون فرايداي=اشتراكك هينتهي يوم الجمعة.|A:I want to cancel my subscription.=عايز ألغي اشتراكي.;B:I am sorry to hear that. May I ask why?=آسف لسماع كده. ممكن أعرف السبب؟;A:It is too expensive.=غالي أوي.;B:I can offer you a discount if you stay.=أقدر أعرض خصم لو كملت.",
"البيع المهذب (Upselling)|🎁|اربط العرض بمشكلة العميل: Since you use a lot of data, you might like our unlimited plan. من غير ضغط.|upgrade=أبجريد=ترقية;plan=بلان=باقة;benefit=بينيفت=ميزة;extra=إكسترا=زيادة;limited offer=ليميتد أوفر=عرض محدود;interested=إنترستد=مهتم;worth it=ورث إت=يستاهل;no pressure=نو بريشر=من غير ضغط|Since you use a lot of data, you might like our unlimited plan.=سينس يو يوز إيه لوت أوف ديتا يو مايت لايك آور أنليميتد بلان=بما إنك بتستخدم داتا كتير ممكن تعجبك الباقة المفتوحة.;Would you be interested in an upgrade?=وود يو بي إنترستد إن أن أبجريد=هل أنت مهتم بالترقية؟;There is no pressure, it is your choice.=ذير إز نو بريشر إت إز يور تشويس=مفيش ضغط، القرار قرارك.;This offer ends on Sunday.=ذيس أوفر إندز أون صانداي=العرض ده بينتهي الأحد.|A:Is there a cheaper plan?=في باقة أرخص؟;B:Yes, but this one has more benefits for a small difference.=أيوه، بس دي فيها مميزات أكتر بفرق بسيط.",
"السياسات والاسترداد|📜|اشرح السياسة بهدوء: According to our policy... Unfortunately, I am not able to... But what I can do is...|according to=أكوردينج تو=طبقا لـ;policy=بوليسي=سياسة;refund=ريفند=استرداد;eligible=إليجبل=مستحق;exception=إكسبشن=استثناء;within=ويذين=خلال;working days=ورکينج ديز=أيام عمل;unfortunately=أنفورتشنتلي=للأسف|According to our policy, refunds take five working days.=أكوردينج تو آور بوليسي ريفندز تيك فايف ورکينج ديز=طبقا لسياستنا الاسترداد بياخد خمس أيام عمل.;Unfortunately, I am not able to do that.=أنفورتشنتلي آي آم نوت إيبل تو دو ذات=للأسف مقدرش أعمل ده.;But what I can do is offer a replacement.=بات وات آي كان دو إز أوفر إيه ريبليسمنت=بس اللي أقدر أعمله أعرض استبدال.;You are eligible for a full refund.=يو آر إليجبل فور إيه فول ريفند=مستحق استرداد كامل.|A:I want my money back.=عايز فلوسي ترجع.;B:I understand. You are eligible, and it will take five working days.=فاهم. مستحق، وهياخد خمس أيام عمل.",
"كتابة الإيميلات والشات|✉️|الإيميل المهني: Dear + اسم, ... Best regards. قصير وواضح ومؤدب. في الشات: رد سريع وجملة قصيرة.|Dear=دير=عزيزي;regards=ريجاردز=تحياتي;attached=أتاتشد=مرفق;as requested=آز ريكويستد=كما طلبت;please find=بليز فايند=تجد مرفقا;reply=ريبلاي=رد;sincerely=سينسيرلي=بإخلاص;follow up=فولو أب=متابعة|Dear Mr. Ali, thank you for contacting us.=دير مستر علي ثانك يو فور كونتاكتينج أس=عزيزي السيد علي، شكرا لتواصلك معنا.;Please find the invoice attached.=بليز فايند ذي إنفويس أتاتشد=تجد الفاتورة مرفقة.;I am writing to follow up on your request.=آي آم رايتينج تو فولو أب أون يور ريكويست=بكتب لأتابع طلبك.;Best regards, Ahmed.=بست ريجاردز أحمد=مع تحياتي، أحمد.|A:Hi, I need help with my order.=أهلا، محتاج مساعدة في طلبي.;B:Hello! I would be glad to help. Could you share your order number?=أهلا! يسعدني أساعد. ممكن رقم الطلب؟",

const TIPS={30:"أول ١٠ ثواني بتحدد شكل المكالمة: ترحيب واضح، اسم الشركة، اسمك، وبعدين على طول سبب مكالمة العميل. صوت هادي وواضح وبسرعة ثابتة.",31:"لو هتطلب بيانات للتحقق، قول ليه محتاجها (For your security...) واطلب مرة واحدة بس ما تكررش أسئلة العميل جاوب عليها قبل كده.",32:"لما الخط مش واضح اطلب من العميل يهجي الحاجات المهمة (اسم، إيميل، رقم) وأعد قراءتها عليه للتأكيد.",33:"قبل الانتظار اشرح السبب وقول المدة التقريبية. لو طولت ارجع للعميل وحدّثه. ولو التحويل لازم، اشرح ليه وأعط القسم الجديد ملخص عشان العميل ما يعيدش القصة.",34:"ابدأ بسؤال مفتوح (What seems to be the problem?) وبعدين أسئلة محددة تضيق السبب. وبعد ما العميل يحكي لخص كلامه عشان تتأكد إنك فهمت.",35:"أي عميل زعلان محتاج يحس إنه اتسمع قبل ما تحل. اعتذر وتعاطف بجملة قصيرة وبعدين انتقل للحل. ما تدافعش عن نفسك وما تلومش العميل.",36:"اشرح الحل خطوة خطوة وبترتيب (First, Then, Finally) واسأل بعد كل خطوة لو في مشكلة. ما تستعملش مصطلحات تقنية معقدة.",37:"قبل ما تقفل لخص اللي اتعمل والخطوة الجاية، واسأل لو في حاجة تانية، وبعدين شكر وتحية. الخاتمة الواضحة بتحسّن رضا العميل.",58:"مع العميل الغاضب: ما تقاطعوش، اعترف بإحساسه، اعتذر، وقول بالظبط هتعمل إيه. نبرة هادية وسرعة ثابتة، وما تردش بنفس انفعاله.",59:"لخص كلام العميل بجملة (Just to confirm...) ده بيحسسه إنك سامعه وبيقلل الغلط، خصوصا في الأرقام والأسماء.",60:"في الفواتير حدد المبلغ والتاريخ بوضوح وكررهم. ما تفترضش إن العميل فاهم المصطلحات المالية: بسّط.",61:"في الدعم الفني: خطوة واحدة كل مرة، واستنى العميل يقول خلصت قبل الخطوة اللي بعدها. كلام بسيط وبدون اختصارات.",62:"لما تصعّد حالة، قول للعميل مين هيتصل ومتى، واديله رقم الحالة. التعامل الدافي (warm transfer) معناه تنقل المعلومة للقسم التاني بنفسك.",63:"المكالمة الناجحة مراحلها: افتتاح، تحقق، فهم المشكلة، تشخيص السبب، حل أو تحويل، تأكيد النتيجة، إغلاق واضح. تدرّب عليها كاملة بصوتك.",85:"الشكوى فرصة: شكر العميل إنه قال، تحمل المسؤولية بدل ما ترمي على قسم تاني، وحدد حل وميعاد. ومتأكدش من الرضا في الآخر.",86:"قبل الإلغاء اسأل عن السبب بأدب واعرض بديل أو خصم مرة واحدة. لو العميل أصر، احترم قراره وخلّص الإجراء بسرعة ولطف.",87:"البيع الناجح بيبدأ بمشكلة العميل مش بالمنتج. اعرض بعد ما تحل مشكلته، من غير ضغط، وقبل أي عرض اسأل لو مهتم.",88:"اشرح السياسة بلغة بسيطة وقول اللي تقدر تعمله بدل ما تركز على اللي ما تقدرش عليه (But what I can do is...).",89:"الإيميل المهني: سطر ترحيب، الغرض في أول جملة، نقاط قصيرة، خطوة تالية واضحة، وتوقيع. في الشات: ردود قصيرة وسريعة وبدون عامية.",90:"لو ما فهمتش اللهجة: ما تتظاهرش بالفهم. اطلب الإعادة بأدب، كرر اللي فهمته، واستخدم التهجئة للأسماء والأرقام. الوضوح أهم من السرعة."};

$("#tr").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:40px">⌨️</div><b>${w} كلمة/دقيقة · دقة ${acc}%</b><div class="ph">الدقة أهم من السرعة: ابدأ بدقة ٩٥%+ وبعدين زود السرعة.</div></div><button class="b w" onclick="startTyping()">جملة جديدة</button>`}};$("#tg").textContent=v.txt;$("#ti").focus()}
// ---- lesson (dynamic steps, dialogue) ----
function lessonV(){const i=view.lesson,L=LESSONS[i];const st=[];if(L.L)st.push(["حروف",0]);st.push(["كلمات",1],["جمل",2]);if(L.d)st.push(["حوار",4]);st.push(["قاعدة",3]);
if(view.step==null||!st.some(x=>x[1]==view.step))view.step=st[0][1];let b="";
const tabs=`<div class="row" style="margin:6px 0">${st.map(s=>`<button class="b ${s[1]==view.step?'':'s'}" style="flex:1;margin:0 2px;padding:8px 2px;font-size:14px" onclick="view.step=${s[1]};render()">${s[0]}</button>`).join("")}</div>`;
const btn=t=>`<button class="b s" onclick="say('${esc(t)}')">🔊</button><button class="b s" onclick="say('${esc(t)}','en-US',.5)">🐢</button>`;
if(view.step==0){b=`<div class="note">حروف وأصوات الدرس. اسمع كل مثال وكرره بصوت عالي.</div>`+L.L.map(l=>`<div class="card"><div class="row"><div class="big">${l[0]}</div><div style="flex:1"><div class="ar"><b>${l[1]}</b></div><div class="ph">${l[2]}</div><div class="en" style="font-size:20px">${l[5]} ${l[3]} <span class="ph" style="font-size:14px">(${l[4]})</span></div></div></div><button class="b s" onclick="say('${l[3]}')">🔊 ${l[3]}</button><button class="b s" onclick="say('${l[3]}','en-US',.5)">🐢</button>${l[6]?`<button class="b s" onclick="mouthOpen('${l[6]}')">👄 شوف وضع الفم</button>`:''}</div>`).join("")}
else if(view.step==1)b=L.w.map(w=>`<div class="card"><div class="row"><div><div class="en">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div></div><div>${btn(w[0])}</div></div></div>`).join("");
else if(view.step==2)b=L.s.map(w=>`<div class="card"><div class="en" style="font-size:20px">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div>${btn(w[0])}<button class="b s" onclick="shadow('${esc(w[0])}')">🎙️ سجّل صوتك</button><div id="sh"></div></div>`).join("");
else if(view.step==4){const hide=view.hide;b=`<div class="note">اضغط «اخفِ كلام الموظف»، قل جملة الموظف (أو الشخص A) بصوتك، وبعدين اسمعها وقارن. خلي حد يمثل الدور التاني أو مثّله بنفسك.</div><button class="b s w" onclick="view.hide=!view.hide;render()">${hide?'أظهر كلام الموظف':'اخفِ كلام الموظف'}</button>`+L.d.map(x=>`<div class="card" style="${x[0]=='A'?'border-right:5px solid var(--pri)':''}"><b>${isCC(i)?(x[0]=='A'?'🧑‍💼 الموظف':'🙋 العميل'):(x[0]=='A'?'🗣️ A':'🗨️ B')}</b>${x[0]=='A'&&hide?'<div class="ph">النص مخفي... قلها بصوتك</div>':`<div class="en" style="font-size:18px">${x[1]}</div><div class="ar">${x[2]}</div>`}${btn(x[1])}</div>`).join("")}
else b=`<div class="card"><b>📘 شرح القاعدة</b><div class="ar" style="margin:8px 0">${L.n}</div><button class="b s" onclick="sayAr('${esc(L.n)}')">🔊 اسمع الشرح بالعربي</button><div class="ph">الصوت العربي بيعتمد على الأصوات المنزّلة في تليفونك.</div></div>${L.tip?`<div class="card" style="border-right:5px solid var(--pri)"><b>💡 نصيحة محترفين</b><div class="ar" style="margin:8px 0">${L.tip}</div><button class="b s" onclick="sayAr('${esc(L.tip)}')">🔊 اسمع النصيحة</button></div>`:''}`;
$("#app").innerHTML=`<div class="row"><b>${isCC(i)?'🎧 كول سنتر':(L.lv?L.lv+' · الدرس '+L.ln:(i>=38?'A2 · الدرس '+(i-37):'الدرس '+(i+1)))}: ${L.e} ${L.t}</b><button class="b s" onclick="view=null;render()">رجوع</button></div>${tabs}${b}<button class="b w" onclick="startLesson(${i})">✍️ ابدأ اختبار الدرس</button>`;scrollTo(0,0)}
function startLesson(i){T={name:`اختبار: ${LESSONS[i].t}`,qs:mkTest(items(i),8,true),i:0,ok:0,pass:70,after:p=>{S.done[i]=Math.max(S.done[i]||0,p);if(p>=70)S.xp+=20},back:"lesson",les:i};render()}
// ---- shadowing recorder (no scoring: play model then your own voice) ----
let rec=null;
async function shadow(t){const el=document.getElementById("sh");
if(rec&&rec.state==="recording"){rec.stop();return}
try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());const u=URL.createObjectURL(new Blob(ch,{type:rec.mimeType}));if(el)el.innerHTML=`<div class="ph">سمّع الاتنين وقارن بنفسك:</div><button class="b s" onclick="say('${esc(t)}')">🔊 النموذج</button><audio controls src="${u}" style="width:100%"></audio>`};
rec.start();if(el)el.innerHTML=`<button class="b" style="background:#c0392b" onclick="rec.stop()">⏹️ إيقاف التسجيل</button> <span class="ph">بيسجل... قل الجملة</span>`;say(t)}catch(e){alert("محتاج تسمح بالميكروفون")}}
// ---- review (SM-2) ----
function startReview(){let l=dueItems().slice(0,10);if(l.length<5){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).map(Number);l=l.concat(shuf(d.flatMap(items)).slice(0,10-l.length))}
if(!l.length)return;T={name:"مراجعة ذكية",qs:mkTest(l,10,false),i:0,ok:0,pass:70,after:p=>{S.revs++;S.rv=today();S.xp+=10},back:"review"};tab="review";render()}
function review(){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).length,due=dueItems().length;const wr=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,8);
$("#app").innerHTML=`<div class="card"><b>🔁 مراجعة ذكية (تكرار متباعد)</b><div class="ar">الكلمة اللي تجاوبها صح بترجع بعد ١ ثم ٣ أيام ثم أكتر. اللي بتغلط فيها بترجع بسرعة. ده أسرع طريق للحفظ طويل المدى.</div>${d?`<div class="tag">مستحق دلوقتي: ${due}</div><button class="b w" onclick="startReview()">ابدأ المراجعة</button>`:'<div class="note">خلص درس واحد على الأقل الأول.</div>'}</div>
${wr.length?`<h2>كلمات محتاجة تركيز</h2><div class="card">${wr.map(w=>`<div class="item row"><span class="en" style="font-size:18px">${w[0]}</span><span class="tag">غلطات: ${w[1]}</span></div>`).join("")}</div>`:''}`}
function pick(k){const q=T.qs[T.i];q.d=k;const ok=q.opts[k]===q.ans;if(ok){T.ok++;S.xp+=2}else if(q.it){S.wrong[q.it.en]=(S.wrong[q.it.en]||0)+1}if(q.it&&q.type!="let")srUpdate(q.it.en,ok);save();render()}
// ---- placement ----
function startPlacement(){const l=[0,4,8,12,16,20,24,28].flatMap(i=>items(i).filter(x=>x.k=="w").slice(0,2)).concat([2,6,10,14].map(i=>items(i).find(x=>x.k=="s")));T={name:"تحديد المستوى",qs:mkTest(l,12,false),i:0,ok:0,pass:0,after:p=>{const s=Math.round(p*12/100);const st=s>=11?15:s>=8?8:s>=5?4:0;S.pl=st;if(st){S.plmsg=st}},back:"home",place:1};render()}
// ---- test result (adds placement + XP) ----
function testV(){const q=T.qs[T.i];if(!q){const p=Math.round(T.ok/T.qs.length*100),pass=p>=T.pass;T.after(p);S.days[today()]=(S.days[today()]||0)+1;save();
if(T.place){const st=S.pl;$("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🎯</div><b>نتيجتك: ${p}%</b><div class="ar">${st?`ننصحك تبدأ من الدرس ${st+1}. الدروس قبله ممكن ترجعلها وقت ما تحب.`:'ابدأ من الدرس ١ علشان تبني الأساس صح.'}</div></div>${st?`<button class="b w" onclick="for(let i=0;i<${st};i++)if(!(S.done[i]>=70))S.done[i]=71;save();T=null;go('home')">تمام، ابدأ من الدرس ${st+1} (يتم احتساب الدروس السابقة)</button>`:''}<button class="b s w" onclick="T=null;go('home')">ابدأ من الأول</button>`;return}
$("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">${pass?'🎉':'💪'}</div><b>${T.name}: ${p}%</b><div class="ar">${pass?'نجحت! ✅':`محتاج ${T.pass}% عشان تعدي. راجع وحاول تاني.`}</div></div><button class="b w" onclick="${T.back=='lesson'?`T=null;view={lesson:${T.les}};render()`:`go('${T.back}')`}">${T.back=='lesson'?'رجوع للدرس':'تمام'}</button>${pass&&T.back=='lesson'?`<button class="b s w" onclick="go('home')">الرئيسية</button>`:''}`;return}
$("#app").innerHTML=`<div class="ph">${T.name} · ${T.i+1}/${T.qs.length}</div><div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div><div class="card"><div class="ar">${q.ask}</div><div class="${q.en?'en':'ar'}" style="margin:8px 0;${q.en?'':'font-size:24px'}">${q.p}</div>${q.say?`<button class="b s" onclick="say('${esc(q.say)}')">🔊</button>`:''}</div>${q.opts.map((o,k)=>`<button class="opt ${q.lopt||q.type=='let'?'l':''} ${q.d!=null?(o===q.ans?'ok':q.d===k?'no':''):''}" ${q.d!=null?'disabled':''} onclick="pick(${k})">${o}</button>`).join("")}${q.d!=null?`<button class="b w" onclick="T.i++;render()">التالي</button>`:''}`;
if(q.auto&&!q.played){q.played=1;setTimeout(()=>say(q.say),300)}}
// ---- pronunciation tab: mouths + minimal pairs ----
const PAIRS=[["ship","sheep"],["bit","beat"],["pen","ben"],["pan","ban"],["very","berry"],["fine","vine"],["light","right"],["think","sink"],["full","fool"],["cat","cut"]];
function mouth(){$("#app").innerHTML=`<div class="note">رسومات توضح وضع اللسان والشفايف. الدايرة الحمرا مكان الحركة. اسمع المثال بعد ما تشوف الرسمة.</div><div class="card"><b>👂 أزواج صوتية (Minimal pairs)</b><div class="ph">كلمات صوتها قريب. افرق بينهم بالسمع والنطق.</div>${PAIRS.map(p=>`<div class="item row"><span class="en" style="font-size:18px">${p[0]} / ${p[1]}</span><span><button class="b s" onclick="say('${p[0]}','en-US',.7)">🔊 ${p[0]}</button><button class="b s" onclick="say('${p[1]}','en-US',.7)">🔊 ${p[1]}</button></span></div>`).join("")}</div>`+MORD.map(k=>mouthCard(k)).join("")}
// ---- settings ----
function me(){const installed=matchMedia("(display-mode: standalone)").matches;const perm=window.Notification?Notification.permission:"غير مدعوم";const dc=Object.keys(S.done).filter(k=>S.done[k]>=70).length;
$("#app").innerHTML=`<div class="card"><b>🎨 المظهر</b><div class="row" style="margin-top:6px"><button class="b ${S.theme=='light'?'':'s'}" style="flex:1" onclick="S.theme='light';save();render()">☀️ فاتح</button><button class="b ${S.theme=='soft'?'':'s'}" style="flex:1" onclick="S.theme='soft';save();render()">🌙 داكن هادي</button></div></div>
<div class="card"><b>🔔 تذكير يومي</b><div class="ar">وقت التذكير: <input type="time" value="${S.rem.time}" onchange="S.rem.time=this.value;save();pushCfg()"></div>
<button class="b w" onclick="setRem(${!S.rem.on})">${S.rem.on?'إيقاف التذكير':'تشغيل التذكير'}</button><button class="b s w" onclick="notify('تجربة: '+taskText())">جرب إشعار الآن</button>
<div class="note">حالة الإذن: ${perm}. ${installed?'التطبيق مثبت ✅':'التطبيق غير مثبت: التذكير بيشتغل بس وهو مفتوح.'} لو الأندرويد وقف التطبيق في الخلفية ممكن التذكير يتأخر، شغّل "بدون قيود للبطارية" للتطبيق.</div></div>
<div class="card"><b>🧾 إحصائيات</b><div class="ar">XP: ${S.xp} · المستوى ${lvl()}<br>دروس مكتملة: ${dc} / ${LESSONS.length}<br>أيام تدريب: ${Object.keys(S.days).length}<br>مرات المراجعة: ${S.revs}<br>كلمات في المراجعة الذكية: ${Object.keys(S.sr).length}</div></div>
<div class="card"><button class="b r w" style="background:#c0392b" onclick="if(confirm('مسح كل التقدم؟')){localStorage.removeItem('eng2');location.reload()}">مسح التقدم</button></div>`}
render();
