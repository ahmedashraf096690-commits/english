*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}

.en{direction:ltr;text-align:left;font-size:24px;font-weight:700;unicode-bidi:isolate}.ph{color:var(--mut);font-size:15px}.ar{font-size:18px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}

.opt{display:block;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;font-family:inherit;margin:6px 0}
.opt.ok{border-color:var(--ok);background:#e7f6ec}.opt.no{border-color:var(--bad);background:#fbe9e7}.opt.l{direction:ltr}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:#fff7dd;border:1px solid #efdf9c;border-radius:12px;padding:10px;font-size:14px;margin:10px 0}
.les{display:flex;gap:12px;align-items:center}.les .n{width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.les.done .n{background:var(--pri);color:#fff}.les.lock{opacity:.5}
h2{font-size:17px;margin:16px 0 4px}.tag{font-size:12px;background:var(--pri2);color:var(--pri);border-radius:8px;padding:1px 8px}
.big{font-size:44px;font-weight:800;direction:ltr;color:var(--pri)}
svg.mouth{width:100%;max-width:340px;display:block;margin:0 auto;background:#fdf8f0;border-radius:12px}
.item{padding:8px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}

<div class="card"><span class="tag">مهمة النهارده ${doneToday?'✅ اتعملت':''}</span>${n>=0?`<div class="ar" style="margin:6px 0">الدرس ${n+1}: ${LESSONS[n].e} ${LESSONS[n].t}</div><button class="b w" onclick="openLesson(${n})">ابدأ الدرس</button>`:`<div class="ar">خلصت كل دروس A1 🎉</div>`}
${doneCount()>=3?`<button class="b s w" onclick="go('review')">🔁 مراجعة سريعة (٥ دقايق)</button>`:''}</div>
<h2>خريطة الطريق</h2>`+[["A1","مبتدئ: ١٤ درس في النموذج","on"],["A2","روتين، ماضي بسيط، تسوق، اتجاهات",""],["B1","تجارب، مستقبل، آراء",""],["B2","نقاش، قراءة مقالات، شغل",""],["C1","طلاقة، أسلوب، كتابة رسمية",""]].map(r=>`<div class="card les ${r[2]?'':'lock'}"><div class="n" style="border-radius:10px;width:46px">${r[0]}</div><div>${r[1]}${r[2]?'':'<br><small class="ph">قريبا</small>'}</div></div>`).join("")}
// ---- course ----
function course(){let h="";for(let u=0;u<2;u++){h+=`<h2>الوحدة ${u+1}</h2>`;for(let i=UNITS[u][0];i<=UNITS[u][1];i++){const d=S.done[i];h+=`<div class="card les ${d>=70?'done':''}" onclick="openLesson(${i})"><div class="n">${d>=70?'✓':i+1}</div><div style="flex:1"><b>${LESSONS[i].e} ${LESSONS[i].t}</b><div class="ph">${LESSONS[i].L[0][0]}${LESSONS[i].L[1]?' · '+LESSONS[i].L[1][0]:''} · ${LESSONS[i].w.length} كلمات · ${LESSONS[i].s.length} جمل${d!=null?' · آخر نتيجة '+d+'%':''}</div></div></div>`}
const r=unitReady(u),ut=S.unit[u];h+=`<div class="card les ${r?'':'lock'}"><div class="n">🏁</div><div style="flex:1"><b>اختبار الوحدة ${u+1}</b><div class="ph">${r?'جاهز'+(ut!=null?' · آخر نتيجة '+ut+'%':''):'يفتح بعد إنهاء دروس الوحدة'}</div></div><button class="b" ${r?'':'disabled'} onclick="startUnit(${u})">ابدأ</button></div>`}
$("#app").innerHTML=h;}
function openLesson(i){tab="course";view={lesson:i,step:0};render()}
// ---- lesson ----
function lessonV(){const i=view.lesson,L=LESSONS[i];const steps=["حروف","كلمات","جمل","قاعدة"];let b="";
const tabs=`<div class="row" style="margin:6px 0">${steps.map((s,k)=>`<button class="b ${k==view.step?'':'s'}" style="flex:1;margin:0 2px;padding:8px 2px;font-size:14px" onclick="view.step=${k};render()">${s}</button>`).join("")}</div>`;
if(view.step==0){b=`<div class="note">حروف وأصوات الدرس. اسمع كل مثال وكرره بصوت عالي.</div>`+L.L.map(l=>`<div class="card"><div class="row"><div class="big">${l[0]}</div><div style="flex:1"><div class="ar"><b>${l[1]}</b></div><div class="ph">${l[2]}</div><div class="en" style="font-size:20px">${l[5]} ${l[3]} <span class="ph" style="font-size:14px">(${l[4]})</span></div></div></div><button class="b s" onclick="say('${l[3]}')">🔊 ${l[3]}</button><button class="b s" onclick="say('${l[3]}','en-US',.5)">🐢</button>${l[6]?`<button class="b s" onclick="mouthOpen('${l[6]}')">👄 شوف وضع الفم</button>`:''}</div>`).join("")}
else if(view.step==1)b=L.w.map(w=>`<div class="card"><div class="row"><div><div class="en">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div></div><div><button class="b s" onclick="say('${esc(w[0])}')">🔊</button><button class="b s" onclick="say('${esc(w[0])}','en-US',.5)">🐢</button></div></div></div>`).join("");
else if(view.step==2)b=L.s.map(w=>`<div class="card"><div class="en" style="font-size:20px">${w[0]}</div><div class="ph">النطق: ${w[1]}</div><div class="ar">${w[2]}</div><button class="b s" onclick="say('${esc(w[0])}')">🔊</button><button class="b s" onclick="say('${esc(w[0])}','en-US',.5)">🐢</button></div>`).join("");
else b=`<div class="card"><b>📘 شرح القاعدة</b><div class="ar" style="margin:8px 0">${L.n}</div><button class="b s" onclick="sayAr('${esc(L.n)}')">🔊 اسمع الشرح بالعربي</button><div class="ph">الصوت العربي بيعتمد على الأصوات المنزّلة في تليفونك.</div></div>`;
$("#app").innerHTML=`<div class="row"><b>الدرس ${i+1}: ${L.e} ${L.t}</b><button class="b s" onclick="view=null;render()">رجوع</button></div>${tabs}${b}<button class="b w" onclick="startLesson(${i})">✍️ ابدأ اختبار الدرس</button>`;scrollTo(0,0)}
function startLesson(i){T={name:`اختبار الدرس ${i+1}`,qs:mkTest(items(i),8,true),i:0,ok:0,pass:70,after:p=>{S.done[i]=Math.max(S.done[i]||0,p)},back:"lesson",les:i}; render()}
function startUnit(u){const l=[];for(let i=UNITS[u][0];i<=UNITS[u][1];i++)l.push(...items(i));T={name:`اختبار الوحدة ${u+1}`,qs:mkTest(l,15,false),i:0,ok:0,pass:75,after:p=>{S.unit[u]=Math.max(S.unit[u]||0,p)},back:"course"};render()}
function startReview(){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).map(Number);if(!d.length)return;const l=d.flatMap(items).map(x=>({x,w:(S.wrong[x.en]||0)+Math.random()*2})).sort((a,b)=>b.w-a.w).slice(0,10).map(o=>o.x);
T={name:"اختبار مراجعة",qs:mkTest(l,10,false),i:0,ok:0,pass:70,after:p=>{S.revs++;S.rv=today()},back:"review"};tab="review";render()}
function review(){const d=Object.keys(S.done).filter(k=>S.done[k]>=70).length;const wr=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,8);
$("#app").innerHTML=`<div class="card"><b>🔁 اختبار مراجعة</b><div class="ar">بيجمع ١٠ أسئلة من الدروس اللي خلصتها، وبيركز على الكلمات اللي بتغلط فيها. الأفضل كل ٣ دروس.</div>${d?`<button class="b w" onclick="startReview()">ابدأ المراجعة</button>`:'<div class="note">خلص درس واحد على الأقل الأول.</div>'}</div>
${wr.length?`<h2>كلمات محتاجة تركيز</h2><div class="card">${wr.map(w=>`<div class="item row"><span class="en" style="font-size:18px">${w[0]}</span><span class="tag">غلطات: ${w[1]}</span></div>`).join("")}</div>`:''}`}
// ---- test ----
function testV(){const q=T.qs[T.i];if(!q){const p=Math.round(T.ok/T.qs.length*100),pass=p>=T.pass;T.after(p);S.days[today()]=(S.days[today()]||0)+1;save();
$("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">${pass?'🎉':'💪'}</div><b>${T.name}: ${p}%</b><div class="ar">${pass?'نجحت! الدرس اتحسب.':`محتاج ${T.pass}% عشان تعدي. راجع الدرس وحاول تاني.`}</div></div><button class="b w" onclick="${T.back=='lesson'?`T=null;view={lesson:${T.les},step:0};render()`:`go('${T.back}')`}">${T.back=='lesson'?'رجوع للدرس':'تمام'}</button>${pass&&T.back=='lesson'?`<button class="b s w" onclick="go('home')">الرئيسية</button>`:''}`;return}
$("#app").innerHTML=`<div class="ph">${T.name} · ${T.i+1}/${T.qs.length}</div><div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div><div class="card"><div class="ar">${q.ask}</div><div class="${q.en?'en':'ar'}" style="margin:8px 0;${q.en?'':'font-size:24px'}">${q.p}</div>${q.say?`<button class="b s" onclick="say('${esc(q.say)}')">🔊</button>`:''}</div>${q.opts.map((o,k)=>`<button class="opt ${q.lopt||q.type=='let'?'l':''} ${q.d!=null?(o===q.ans?'ok':q.d===k?'no':''):''}" ${q.d!=null?'disabled':''} onclick="pick(${k})">${o}</button>`).join("")}${q.d!=null?`<button class="b w" onclick="T.i++;render()">التالي</button>`:''}`;
if(q.auto&&!q.played){q.played=1;setTimeout(()=>say(q.say),300)}}
function pick(k){const q=T.qs[T.i];q.d=k;const ok=q.opts[k]===q.ans;if(ok)T.ok++;else if(q.it){const w=q.it.en;S.wrong[w]=(S.wrong[w]||0)+1}save();render()}
// ---- mouth diagrams ----
function mouthSvg(k){const tongue={
L:"M185 130 Q150 112 110 108 Q80 104 62 80 Q54 68 50 68 L46 74 Q50 98 66 118 Q120 150 185 140 Z",
R:"M185 132 Q165 86 135 90 Q115 94 105 76 L97 80 Q96 100 88 116 Q120 150 185 140 Z",
TH:"M185 130 Q140 108 90 110 L34 102 L32 116 Q60 126 90 122 Q140 148 185 140 Z"}[k]||"M185 134 Q140 118 90 122 Q60 124 50 124 L50 134 Q110 156 185 142 Z";
const closed=k=="B"||k=="P",lip=(k=="F"||k=="V");
const up=closed?"M8 54 Q10 90 28 95":"M8 54 Q10 78 28 84";
const lo=closed?"M8 136 Q12 100 28 97":lip?"M8 136 Q14 104 31 88":"M8 136 Q12 106 28 106";
const mark={L:[50,68],R:[100,62],TH:[34,108],F:[31,88],V:[31,88],B:[28,96],P:[28,96]}[k];
const air=(k=="P")?`<path d="M4 96 L-0 96" stroke="#c0392b"/>`:"";
return `<svg class="mouth" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg"><path d="M28 60 Q60 46 100 48 Q150 50 190 72" fill="none" stroke="#8a5a3c" stroke-width="5"/><path d="M190 72 L190 132" stroke="#8a5a3c" stroke-width="5"/><path d="M28 132 Q100 165 190 134" fill="none" stroke="#8a5a3c" stroke-width="5"/><path d="${tongue}" fill="#e88a8a" stroke="#c75d5d" stroke-width="2"/><rect x="26" y="60" width="14" height="26" rx="4" fill="#fff" stroke="#bbb"/><rect x="28" y="104" width="14" height="24" rx="4" fill="#fff" stroke="#bbb"/><path d="${up}" fill="none" stroke="#e0868f" stroke-width="10" stroke-linecap="round"/><path d="${lo}" fill="none" stroke="#e0868f" stroke-width="10" stroke-linecap="round"/><circle cx="${mark[0]}" cy="${mark[1]}" r="9" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/><text x="150" y="40" font-size="11" fill="#6b7385" text-anchor="middle">سقف الحلق</text><text x="110" y="172" font-size="11" fill="#6b7385" text-anchor="middle">اللسان</text><text x="34" y="34" font-size="11" fill="#6b7385" text-anchor="middle">الشفاه</text></svg>`}
const MORD=["R","L","TH","F","V","B","P"];
function mouth(){$("#app").innerHTML=`<div class="note">رسومات توضح وضع اللسان والشفايف. الدايرة الحمرا مكان الحركة. اسمع المثال بعد ما تشوف الرسمة.</div>`+MORD.map(k=>mouthCard(k)).join("")}
function mouthCard(k){const ex={R:"red, right, around",L:"light, lion, hello",TH:"think, this, mother",F:"fish, fine, off",V:"very, video, love",B:"ball, baby, job",P:"pen, paper, stop"}[k];
return `<div class="card" id="m${k}"><b dir="ltr" style="font-size:22px">${k}</b>${mouthSvg(k)}<div class="ar" style="margin:8px 0">${MOUTH[k][0]}</div><div class="en" style="font-size:18px">${ex}</div>${ex.split(", ").map(w=>`<button class="b s" onclick="say('${w}','en-US',.6)">🔊 ${w}</button>`).join("")}<button class="b s" onclick="sayAr('${esc(MOUTH[k][0])}')">🔊 شرح بالعربي</button></div>`}
function mouthOpen(k){tab="mouth";view=null;T=null;render();setTimeout(()=>{const e=document.getElementById("m"+k);if(e)e.scrollIntoView()},50)}
// ---- reminder ----
async function swReg(){try{return await navigator.serviceWorker.getRegistration()}catch(e){}}
async function notify(txt){const t="🔔 وقت إنجليزي";const r=await swReg();if(r&&r.showNotification)return r.showNotification(t,{body:txt,icon:undefined,tag:"daily"});if(window.Notification&&Notification.permission==="granted")new Notification(t,{body:txt})}
function taskText(){const n=nextTask();return n>=0?`مهمة النهارده: الدرس ${n+1} (${LESSONS[n].t})`:"وقت المراجعة اليومية"}
async function pushCfg(){try{const c=await caches.open("eng-cfg");await c.put("cfg",new Response(JSON.stringify({on:S.rem.on,time:S.rem.time,text:taskText()})))}catch(e){}}
async function setRem(on){if(on){if(!window.Notification)return alert("المتصفح لا يدعم الإشعارات");const p=await Notification.requestPermission();if(p!=="granted"){S.rem.on=false;save();return me()}
try{const r=await swReg();if(r&&r.periodicSync)await r.periodicSync.register("daily",{minInterval:12*3600*1000})}catch(e){}}
S.rem.on=on;save();pushCfg();me()}
function tickRem(){if(!S.rem.on)return;const d=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
if(hm>=S.rem.time&&S.remLast!==today()&&!S.days[today()]){S.remLast=today();save();notify(taskText())}}
setInterval(tickRem,30000);document.addEventListener("visibilitychange",tickRem);
function me(){const installed=matchMedia("(display-mode: standalone)").matches;const perm=window.Notification?Notification.permission:"غير مدعوم";
$("#app").innerHTML=`<div class="card"><b>🔔 تذكير يومي</b><div class="ar">وقت التذكير: <input type="time" value="${S.rem.time}" onchange="S.rem.time=this.value;save();pushCfg()"></div>
<button class="b w" onclick="setRem(${!S.rem.on})">${S.rem.on?'إيقاف التذكير':'تشغيل التذكير'}</button><button class="b s w" onclick="notify('تجربة: '+taskText())">جرب إشعار الآن</button>
<div class="note">حالة الإذن: ${perm}. ${installed?'التطبيق مثبت ✅':'التطبيق غير مثبت: التذكير بيشتغل بس وهو مفتوح.'} لو الأندرويد وقف التطبيق في الخلفية ممكن التذكير يتأخر، شغّل "بدون قيود للبطارية" للتطبيق.</div></div>
<div class="card"><b>🧾 إحصائيات</b><div class="ar">دروس مكتملة: ${doneCount()} / ${LESSONS.length}<br>أيام تدريب: ${Object.keys(S.days).length}<br>مرات المراجعة: ${S.revs}</div></div>
<div class="card"><button class="b r w" style="background:#c0392b" onclick="if(confirm('مسح كل التقدم؟')){localStorage.removeItem('eng2');location.reload()}">مسح التقدم</button></div>`}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").then(pushCfg);
render();

</script></body></html>
